<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Social links profile - solution to the Frontend Mentor challenge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social links profile</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <section class="card">
            <img class="card__profile-pic" src="./images/avatar-jessica.jpeg" alt="Jessica Randall">
            <hgroup class="card__header">
                <h1>Jessica Randall</h1>
                <p>London, United Kingdom</p>
            </hgroup>
            <p class="card__bio">"Front-end developer and avid reader."</p>
            <nav class="card__social-links" aria-label="Social media">
                <ul>
                    <li>
                        <a href="#">
                            <span data-text="GitHub">GitHub</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span data-text="Frontend Mentor">Frontend Mentor</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span data-text="LinkedIn">LinkedIn</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span data-text="Twitter">Twitter</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span data-text="Instagram">Instagram</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>
    </main>
</body>
</html>
